[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysledger"
version = "0.1.0"
description = "A ledger of your Linux machine: snapshot packages, services and kernel settings, diff them over time."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ThorrijaDEV" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["linux", "arch-linux", "system", "configuration", "diff", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
sysledger = "sysledger.cli:main"

[project.urls]
Homepage = "https://github.com/ThorrijaDEV/sysledger"

[tool.hatch.build.targets.wheel]
packages = ["src/sysledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
